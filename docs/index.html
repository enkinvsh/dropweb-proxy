<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropweb Proxy</title>
    <style>
      :root { --void:#030305; --card:#0a1710; --border:#08431f; --text:#e2e2e2; --muted:#9aa0aa; --accent:#00de52; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--void); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
      main { max-width:560px; padding:40px 24px; text-align:center; }
      .eyebrow { color:var(--accent); font-weight:600; letter-spacing:0.2em; text-transform:uppercase; font-size:12px; }
      h1 { font-size:34px; margin:8px 0 10px; letter-spacing:-0.6px; }
      p { color:var(--muted); line-height:1.6; }
      .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
      a.btn { text-decoration:none; padding:11px 20px; border-radius:12px; font-weight:600; border:1px solid var(--border); color:var(--text); background:var(--card); transition:border-color .15s; }
      a.btn:hover { border-color:var(--accent); }
      a.primary { background:linear-gradient(90deg,#006d5b,#007a2e); border-color:#00813d; color:#fff; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Dropweb Proxy</p>
      <h1>Proxy on/off, one click.</h1>
      <p>A minimal Chrome &amp; Firefox extension that switches the browser proxy on and off —
        HTTP or SOCKS5, with automatic WebRTC leak protection. No data collection.</p>
      <div class="links">
        <a class="btn primary" href="https://github.com/enkinvsh/dropweb-proxy/releases">Download</a>
        <a class="btn" href="https://github.com/enkinvsh/dropweb-proxy">GitHub</a>
        <a class="btn" href="./privacy-policy.html">Privacy Policy</a>
      </div>
    </main>
  </body>
</html>
